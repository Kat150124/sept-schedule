<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kat的9月身體課表🐱 - 執行筆記</title>
<link rel="stylesheet" href="style.css">
<style>
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .field input,
  .field select,
  .field textarea {
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--required);
  }
  .save-btn {
    margin-top: 18px;
    background: var(--required);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .save-btn:hover { background: #275d59; }
  .save-btn:disabled { opacity: 0.6; cursor: default; }

  /* 篩選工具列樣式 */
  .filter-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 12px 16px;
    border-radius: var(--radius);
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-bar select, .filter-bar input {
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    background: #fff;
  }
  .clear-date-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 4px;
  }
  .clear-date-btn:hover { color: var(--ink); }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .section-head h2 { border: none; padding: 0; margin: 0; }
  .count-badge {
    font-size: 12px;
    background: var(--required-bg);
    color: var(--required);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  .list-empty {
    border: 1px dashed var(--card-border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .record {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    position: relative;
  }
  .record + .record { margin-top: 10px; }
  .record-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
    justify-content: space-between;
  }
  .record-head-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .record-head .date { font-weight: 700; font-size: 14px; }
  .record-actions {
    display: flex;
    gap: 8px;
  }
  .record-actions button {
    background: none;
    border: 1px solid var(--card-border);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .record-actions button:hover {
    background: #f0f0f0;
    color: var(--ink);
  }
  .record-row { font-size: 14px; margin: 4px 0; }
  .record-row .k { color: var(--ink-soft); margin-right: 6px; }
  .status-msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status-msg.error { color: var(--eval); }
  .status-msg.ok { color: var(--required); }

  @media (max-width: 760px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">

  <p class="eyebrow">2026.09</p>
  <h1>Kat的9月身體課表🐱</h1>

  <nav class="top-nav">
    <a href="index.html">課表📅</a>
    <a href="notes.html" class="active">執行筆記📝</a>
  </nav>

  <p class="subtitle" style="margin-top:18px;">記錄每一次訓練、修復與身體回饋。</p>

  <section>
    <h2>新增執行紀錄</h2>
    <div class="panel">
      <form id="record-form">
        <div class="form-grid">
          <div class="field">
            <label for="f-date">日期</label>
            <input type="date" id="f-date" required>
          </div>
          <div class="field">
            <label for="f-category">類別</label>
            <select id="f-category">
              <option value="必修／常態課">必修／常態課</option>
              <option value="練比賽">練比賽</option>
              <option value="培訓課">培訓課</option>
              <option value="培訓個人考核">培訓個人考核</option>
              <option value="休息日（復健修復日）">休息日（復健修復日）</option>
              <option value="比賽">比賽</option>
            </select>
          </div>
          <div class="field full">
            <label for="f-content">課程或訓練內容</label>
            <input type="text" id="f-content" placeholder="例如：Street Jazz-茶葉、臀肌發力訓練">
          </div>
          <div class="field full">
            <label for="f-feeling">身體感受</label>
            <input type="text" id="f-feeling" placeholder="例如：左腳踝微緊、無明顯代償">
          </div>
          <div class="field full">
            <label for="f-notes">詳述</label>
            <textarea id="f-notes" placeholder="其他想記錄的事"></textarea>
          </div>
        </div>
        <button type="submit" class="save-btn" id="save-btn">💾 儲存筆記</button>
        <div class="status-msg" id="status-msg"></div>
      </form>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>執行紀錄</h2>
      <span class="count-badge" id="count-badge">0</span>
    </div>

    <!-- 篩選與排序工具列（包含指定日期） -->
    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-category" style="font-size:12px;">類別：</label>
        <select id="filter-category">
          <option value="">全部類別</option>
          <option value="必修／常態課">必修／常態課</option>
          <option value="練比賽">練比賽</option>
          <option value="培訓課">培訓課</option>
          <option value="培訓個人考核">培訓個人考核</option>
          <option value="休息日（復健修復日）">休息日（復健修復日）</option>
          <option value="比賽">比賽</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filter-date" style="font-size:12px;">指定日期：</label>
        <input type="date" id="filter-date">
        <button type="button" class="clear-date-btn" id="clear-date" title="清除日期">✕</button>
      </div>

      <div class="filter-group">
        <label for="sort-order" style="font-size:12px;">排序：</label>
        <select id="sort-order">
          <option value="desc">日期新 → 舊</option>
          <option value="asc">日期舊 → 新</option>
        </select>
      </div>
    </div>

    <p class="subtitle" style="margin-top:-6px; margin-bottom:14px;">可透過上方條件快速篩選與檢視。</p>
    <div id="record-list">
      <div class="list-empty">還沒有執行筆記。從上方新增第一筆訓練或修復紀錄吧。</div>
    </div>
  </section>
  <footer class="page-footer">🐈‍⬛</footer>
</div>

<script src="config.js"></script>
<script>
const form = document.getElementById('record-form');
const saveBtn = document.getElementById('save-btn');
const statusMsg = document.getElementById('status-msg');
const listEl = document.getElementById('record-list');
const countBadge = document.getElementById('count-badge');
const filterCategoryEl = document.getElementById('filter-category');
const filterDateEl = document.getElementById('filter-date');
const clearDateBtn = document.getElementById('clear-date');
const sortOrderEl = document.getElementById('sort-order');

let allRecords = [];
let editingRecordId = null;

function isConfigured() {
  return typeof APPS_SCRIPT_URL === 'string' && APPS_SCRIPT_URL.startsWith('http');
}

function setStatus(text, type) {
  statusMsg.textContent = text || '';
  statusMsg.className = 'status-msg' + (type ? ' ' + type : '');
}

function categoryClass(cat) {
  if (cat.includes('必修')) return 'required';
  if (cat.includes('練比賽')) return 'compete';
  if (cat.includes('培訓課')) return 'training';
  if (cat.includes('考核')) return 'eval';
  if (cat.includes('休息')) return 'rest';
  if (cat.includes('比賽')) return 'match';
  return 'required';
}

const WEEKDAY_LABELS = ['Sun.', 'Mon.', 'Tue.', 'Wed.', 'Thu.', 'Fri.', 'Sat.'];

function formatDateDisplay(dateStr) {
  if (!dateStr) return '';
  const cleanStr = String(dateStr).substring(0, 10);
  const [y, m, d] = cleanStr.split('-').map(Number);
  if (!y || !m || !d) return cleanStr;

  const dateObj = new Date(y, m - 1, d);
  const weekday = WEEKDAY_LABELS[dateObj.getDay()] || '';

  const mm = String(m).padStart(2, '0');
  const dd = String(d).padStart(2, '0');

  return `${y}.${mm}.${dd} (${weekday})`;
}

function renderRecords() {
  const selectedCategory = filterCategoryEl.value;
  const selectedDate = filterDateEl.value;
  const sortOrder = sortOrderEl.value;

  // 1. 篩選（類別 + 指定日期）
  let filtered = allRecords.filter(r => {
    if (selectedCategory && r.category !== selectedCategory) return false;
    if (selectedDate) {
      const rDateClean = String(r.date).substring(0, 10);
      if (rDateClean !== selectedDate) return false;
    }
    return true;
  });

  // 2. 排序
  filtered.sort((a, b) => {
    if (sortOrder === 'asc') {
      return a.date > b.date ? 1 : -1;
    } else {
      return a.date < b.date ? 1 : -1;
    }
  });

  countBadge.textContent = filtered.length;

  if (!filtered.length) {
    listEl.innerHTML = '<div class="list-empty">沒有符合條件的執行筆記。</div>';
    return;
  }

  listEl.innerHTML = filtered.map(r => {
    if (editingRecordId === r.id) {
      return `
        <div class="record edit-mode">
          <div class="form-grid" style="margin-bottom: 12px;">
            <div class="field">
              <label>日期</label>
              <input type="date" id="edit-date-${r.id}" value="${r.date.substring(0, 10)}">
            </div>
            <div class="field">
              <label>類別</label>
              <select id="edit-category-${r.id}">
                <option value="必修／常態課" ${r.category === '必修／常態課' ? 'selected' : ''}>必修／常態課</option>
                <option value="練比賽" ${r.category === '練比賽' ? 'selected' : ''}>練比賽</option>
                <option value="培訓課" ${r.category === '培訓課' ? 'selected' : ''}>培訓課</option>
                <option value="培訓個人考核" ${r.category === '培訓個人考核' ? 'selected' : ''}>培訓個人考核</option>
                <option value="休息日（復健修復日）" ${r.category === '休息日（復健修復日）' ? 'selected' : ''}>休息日（復健修復日）</option>
                <option value="比賽" ${r.category === '比賽' ? 'selected' : ''}>比賽</option>
              </select>
            </div>
            <div class="field full">
              <label>課程或訓練內容</label>
              <input type="text" id="edit-content-${r.id}" value="${escapeHtml(r.content || '')}">
            </div>
            <div class="field full">
              <label>身體感受</label>
              <input type="text" id="edit-feeling-${r.id}" value="${escapeHtml(r.feeling || '')}">
            </div>
            <div class="field full">
              <label>詳述</label>
              <textarea id="edit-notes-${r.id}">${escapeHtml(r.notes || '')}</textarea>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="save-btn" style="margin-top:0; padding:6px 14px; font-size:13px;" onclick="saveEdit('${r.id}')">儲存</button>
            <button type="button" style="background:#ccc; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:13px;" onclick="cancelEdit()">取消</button>
          </div>
        </div>
      `;
    }

    return `
      <div class="record">
        <div class="record-head">
          <div class="record-head-left">
            <span class="date">${formatDateDisplay(r.date)}</span>
            <span class="tag ${categoryClass(r.category || '')}">${r.category || ''}</span>
          </div>
          <div class="record-actions">
            <button type="button" onclick="startEdit('${r.id}')">✏️ 編輯</button>
            <button type="button" onclick="deleteRecord('${r.id}')">🗑️ 刪除</button>
          </div>
        </div>
        ${r.content ? `<div class="record-row"><span class="k">課程／訓練內容</span>${r.content}</div>` : ''}
        ${r.feeling ? `<div class="record-row"><span class="k">身體感受</span>${r.feeling}</div>` : ''}
        ${r.notes ? `<div class="record-row"><span class="k">詳述</span>${r.notes}</div>` : ''}
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadRecords() {
  if (!isConfigured()) {
    listEl.innerHTML = '<div class="list-empty">尚未設定 Apps Script 網址。</div>';
    return;
  }
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list`);
    const data = await res.json();
    allRecords = data.records || [];
    renderRecords();
  } catch (err) {
    listEl.innerHTML = '<div class="list-empty">讀取紀錄失敗，請確認網路連線。</div>';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!isConfigured()) return;

  const record = {
    date: document.getElementById('f-date').value,
    category: document.getElementById('f-category').value,
    content: document.getElementById('f-content').value.trim(),
    feeling: document.getElementById('f-feeling').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
  };

  if (!record.date) {
    setStatus('請選擇日期。', 'error');
    return;
  }

  saveBtn.disabled = true;
  setStatus('儲存中…');

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'add', record }),
    });
    form.reset();
    setStatus('已儲存！', 'ok');
    await loadRecords();
  } catch (err) {
    setStatus('儲存失敗。', 'error');
  } finally {
    saveBtn.disabled = false;
  }
});

function startEdit(id) {
  editingRecordId = id;
  renderRecords();
}

function cancelEdit() {
  editingRecordId = null;
  renderRecords();
}

async function saveEdit(id) {
  const updatedRecord = {
    id: id,
    date: document.getElementById(`edit-date-${id}`).value,
    category: document.getElementById(`edit-category-${id}`).value,
    content: document.getElementById(`edit-content-${id}`).value.trim(),
    feeling: document.getElementById(`edit-feeling-${id}`).value.trim(),
    notes: document.getElementById(`edit-notes-${id}`).value.trim(),
  };

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'update', record: updatedRecord }),
    });
    editingRecordId = null;
    await loadRecords();
  } catch (err) {
    alert('更新失敗，請稍後再試');
  }
}

async function deleteRecord(id) {
  if (!confirm('確定要刪除這筆執行紀錄嗎？')) return;
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: id }),
    });
    await loadRecords();
  } catch (err) {
    alert('刪除失敗，請稍後再試');
  }
}

// 監聽篩選、指定日期與排序變動
filterCategoryEl.addEventListener('change', renderRecords);
filterDateEl.addEventListener('change', renderRecords);
sortOrderEl.addEventListener('change', renderRecords);

// 清除指定日期按鈕
clearDateBtn.addEventListener('click', () => {
  filterDateEl.value = '';
  renderRecords();
});

loadRecords();
</script>
</body>
</html>
